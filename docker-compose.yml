# docker-compose.yml
version: '3.8'

services:
    # --- 1. アプリケーションサービス (PHP-FPM) ---
    app:
        build:
            context: .
            dockerfile: ./Dockerfile
            # Stage 3: Final Image (本番用 vendor のみ使用) をターゲットにする
            target: final
        container_name: laravel-app
        restart: always
        volumes:
            # 開発中はコード変更をリアルタイムで反映させるためにプロジェクト全体をマウント
            # 注意: このマウントにより、ホスト側の vendor が存在すると上書きされる可能性があります
            - ./:/var/www/html
            # 【修正点】 vendor ディレクトリをホストマウントから除外し、ビルドされた vendor を保持する
            # vendor が存在するホストマウントを避けるための匿名ボリューム
            - /var/www/html/vendor
        depends_on:
            - db
        networks:
            - app-network

    # --- 2. Webサーバーサービス (Nginx) ---
    nginx:
        image: nginx:stable-alpine
        container_name: laravel-nginx
        restart: always
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html
            - ./default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - app-network

    # --- 3. データベースサービス (MySQL) ---
    db:
        image: mysql:8.0
        container_name: laravel-db
        restart: always
        environment:
            MYSQL_DATABASE: laravel_clean
            MYSQL_ROOT_PASSWORD: root_password
            MYSQL_USER: laravel_user
            MYSQL_PASSWORD: laravel_password
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - app-network

    # --- 4. 【追加】テスト実行サービス (CLI) ---
    # PHPUnit や Composer 実行専用のコンテナ
    tester:
        build:
            context: .
            dockerfile: ./Dockerfile
            # Stage 4: test_runner (開発用 vendor を含むステージ) をターゲットにする
            target: test_runner
        container_name: laravel-tester
        # テスト実行時には一時的に起動し、終了したら停止・削除される
        volumes:
            - .:/app # コードを /app にマウント (Dockerfile の WORKDIR に合わせる)
            - /app/vendor # 【重要】ホスト側の vendor マウントを防ぐ
        environment:
            # テスト実行時に必要な環境変数を db サービスに合わせて設定
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_DATABASE: laravel_clean
            DB_USERNAME: laravel_user
            DB_PASSWORD: laravel_password
        depends_on:
            - db
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    dbdata:
        driver: local
